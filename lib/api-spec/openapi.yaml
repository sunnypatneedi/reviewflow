openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: ReviewFlow evidence-grounded labeling API
servers:
  - url: /api
tags:
  - { name: health }
  - { name: reviewflow }
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /reviewflow/bootstrap:
    get:
      operationId: getBootstrap
      tags: [reviewflow]
      responses:
        "200":
          description: Current project state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Bootstrap" }
  /reviewflow/tasks/import:
    post:
      operationId: importTasks
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskImportInput" }
      responses:
        "200":
          description: Validated import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "409": { description: Conflicting external ID }
  /reviewflow/tasks:
    get:
      operationId: listTasks
      tags: [reviewflow]
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
  /reviewflow/evaluation-jobs:
    get:
      operationId: listEvaluationJobs
      tags: [reviewflow]
      parameters:
        - in: query
          name: taskIds
          required: true
          description: Task IDs in the selected evaluation batch.
          schema:
            type: array
            minItems: 1
            maxItems: 200
            items: { type: string }
          style: form
          explode: false
        - in: query
          name: mode
          required: false
          schema: { type: string, enum: [demo, live] }
        - in: query
          name: includeHistory
          required: false
          description: Include superseded experiment jobs; defaults to current identities only.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Evaluation jobs scoped to the current project and requested tasks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EvaluationJob" }
        "400": { description: Invalid task batch filter }
  /reviewflow/evaluation-jobs/retry:
    post:
      operationId: retryEvaluationJob
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluationRetryInput" }
      responses:
        "202":
          description: The selected failed job was re-enqueued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluateResult" }
        "401": { description: Live credentials missing }
        "403": { description: Live consent or authentication required }
        "404": { description: Evaluation job not found in the current project }
        "409": { description: Only terminally failed jobs can be retried }
  /reviewflow/evaluate:
    post:
      operationId: evaluateTasks
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvaluateInput" }
      responses:
        "200":
          description: Evaluation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluateResult" }
        "202":
          description: Evaluation jobs queued for the supervised worker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluateResult" }
        "401": { description: Live credentials missing }
        "502": { description: "Provider failure; never simulated" }
  /reviewflow/review/next:
    get:
      operationId: getNextReview
      tags: [reviewflow]
      responses:
        "200":
          description: Next review item
          content:
            application/json:
              schema:
                type: [object, "null"]
                allOf:
                  - { $ref: "#/components/schemas/ReviewItem" }
  /reviewflow/reviews:
    post:
      operationId: submitReview
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Saved review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "409": { description: Stale review version }
  /reviewflow/metrics:
    get:
      operationId: getMetrics
      tags: [reviewflow]
      responses:
        "200":
          description: Record-derived metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metrics" }
  /reviewflow/releases:
    get:
      operationId: listReleases
      tags: [reviewflow]
      responses:
        "200":
          description: Releases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Release" }
    post:
      operationId: createRelease
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseInput" }
      responses:
        "201":
          description: Immutable release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        "409": { description: Unresolved work blocks release }
  /reviewflow/releases/{id}/download:
    get:
      operationId: downloadRelease
      tags: [reviewflow]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: JSONL export
          content:
            application/x-ndjson:
              schema: { type: string }
  /reviewflow/audits:
    get:
      operationId: listAudits
      tags: [reviewflow]
      responses:
        "200":
          description: Audit records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Audit" }
    post:
      operationId: createAudit
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditInput" }
      responses:
        "201":
          description: Immutable audit assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Audit" }
        "409": { description: Not enough eligible tasks for the requested sample }
  /reviewflow/audits/{id}:
    get:
      operationId: getAudit
      tags: [reviewflow]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Blind audit work surface
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditDetail" }
        "403": { description: Audit is assigned to another auditor }
  /reviewflow/audits/{id}/decisions:
    post:
      operationId: submitAuditDecision
      tags: [reviewflow]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuditDecisionInput" }
      responses:
        "201":
          description: Blind audit decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditDecisionResult" }
        "403": { description: Auditor is not independent }
        "409": { description: Decision already exists }
  /reviewflow/audits/{id}/adjudication:
    get:
      operationId: getAuditAdjudication
      tags: [reviewflow]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Adjudicator-only disagreement queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditAdjudicationDetail" }
        "403": { description: Auditor or original reviewer cannot see this queue }
  /reviewflow/audits/{id}/disputes/{disputeId}/adjudicate:
    post:
      operationId: adjudicateAuditDispute
      tags: [reviewflow]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: disputeId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjudicationInput" }
      responses:
        "200":
          description: Resolved disagreement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditDispute" }
        "403": { description: Auditor or original reviewer cannot adjudicate }
        "409": { description: Disagreement already resolved }
  /reviewflow/factories/{factory}:
    parameters:
      - { in: path, name: factory, required: true, schema: { type: string, enum: [evidence, preference] } }
    get:
      operationId: getFactoryQueue
      tags: [reviewflow]
      responses:
        "200":
          description: Routed work metadata, policy revision and actor-scoped work claims; no labels or candidate identities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryQueue" }
  /reviewflow/factories/{factory}/policy:
    parameters:
      - { in: path, name: factory, required: true, schema: { type: string, enum: [evidence, preference] } }
    post:
      operationId: createFactoryPolicyRevision
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryPolicyInput" }
      responses:
        "201": { description: Immutable policy revision created }
        "403": { description: Owner required }
        "409": { description: Policy changed; reload }
  /reviewflow/factories/{factory}/items/{id}/claim:
    parameters:
      - { in: path, name: factory, required: true, schema: { type: string, enum: [evidence, preference] } }
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: claimFactoryWork
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryClaimInput" }
      responses:
        "201": { description: "Expiring claim created with a new fencing token; token returned only to assignee" }
        "403": { description: Role cannot assign this member }
        "409": { description: "Version, current claim or quarantine conflict" }
  /reviewflow/factories/{factory}/items/{id}/quarantine:
    parameters:
      - { in: path, name: factory, required: true, schema: { type: string, enum: [evidence, preference] } }
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      operationId: setFactoryQuarantine
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryQuarantineInput" }
      responses:
        "200": { description: "Hold updated, claims revoked, audit event committed" }
        "403": { description: Owner required }
        "409": { description: Controls changed; reload }
  /reviewflow/context:
    get:
      operationId: getProjectContext
      tags: [reviewflow]
      responses:
        "200":
          description: Current project role and name without task or decision exposure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectContext" }
  /reviewflow/projects:
    description: Project selection uses the x-reviewflow-project header on subsequent requests. Membership is checked by the server on every request.
    get:
      operationId: listProjects
      tags: [reviewflow]
      responses:
        "200":
          description: Projects for the authenticated member or the private demo
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ProjectRef" } }
    post:
      operationId: createProject
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Empty shared project with independent release policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectRef" }
  /reviewflow/members:
    get:
      operationId: listMembers
      tags: [reviewflow]
      responses:
        "200":
          description: Current project membership revisions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MemberRecord" } }
    post:
      operationId: changeMembership
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipInput" }
      responses:
        "200":
          description: Owner-authorized membership change and claim invalidation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberRecord" }
        "409": { description: Stale membership revision or last-owner protection }
  /reviewflow/jev:
    get:
      operationId: getJevBudget
      tags: [reviewflow]
      responses:
        "200":
          description: Project-wide lifetime call reservations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JevBudget" }
    post:
      operationId: changeJevBudget
      tags: [reviewflow]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JevBudgetInput" }
      responses:
        "200":
          description: Owner-authorized provider control revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JevBudget" }
  /reviewflow/jev/evaluation-plan:
    get:
      operationId: getJevEvaluationPlan
      tags: [reviewflow]
      responses:
        "200":
          description: Preparation only; no provider requests or quality claim
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties: { status: { type: string } }
    Label:
      type: string
      enum: [supported, contradicted, insufficient_evidence]
    Risk:
      type: string
      enum: [low, medium, high]
    TaskStatus:
      type: string
      enum: [pending, proposed, in_review, escalated, finalized]
    TaskInput:
      type: object
      required: [externalId, question, evidence, candidateAnswer, risk]
      properties:
        externalId: { type: string, minLength: 1, maxLength: 120 }
        question: { type: string, minLength: 1, maxLength: 5000 }
        evidence: { type: string, minLength: 1, maxLength: 30000 }
        candidateAnswer: { type: string, minLength: 1, maxLength: 10000 }
        scenarioFamilyId: { type: ["string", "null"], maxLength: 120 }
        risk: { $ref: "#/components/schemas/Risk" }
    TaskImportInput:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/TaskInput" }
    ImportResult:
      type: object
      required: [imported, unchanged, total]
      properties:
        imported: { type: integer }
        unchanged: { type: integer }
        total: { type: integer }
    EvaluationProvenance:
      type: object
      required: [provenance, evaluation_id]
      properties:
        provenance: { type: string, enum: [captured, legacy-unknown] }
        evaluation_id: { type: [string, "null"] }
        snapshot_hash: { type: string }
        question_version: { type: string }
        context_preparation_version: { type: string }
        requested_model: { type: string }
        experiment_run_id: { type: string }
    Proposal:
      type: object
      required: [id, taskId, mode, model, label, labelProbability, probabilities, injectionProbability, complexity, confidence, latencyMs, createdAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        mode: { type: string, enum: [demo, live] }
        model: { type: string }
        evaluation:
          type: [object, "null"]
          allOf:
            - { $ref: "#/components/schemas/EvaluationProvenance" }
        label: { $ref: "#/components/schemas/Label" }
        labelProbability: { type: number, minimum: 0, maximum: 1 }
        probabilities:
          type: object
          additionalProperties: { type: number }
        injectionProbability: { type: number, minimum: 0, maximum: 1 }
        complexity: { type: number, minimum: 1, maximum: 5, description: "ReviewFlow compatibility scale; native Jev fractional Score (0–4) plus one." }
        confidence: { type: number, minimum: 0, maximum: 1 }
        latencyMs: { type: integer }
        inputTokens: { type: ["integer", "null"] }
        outputTokens: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
    Task:
      type: object
      required: [id, externalId, question, evidence, candidateAnswer, risk, status, version, mode, createdAt]
      properties:
        id: { type: string }
        externalId: { type: string }
        question: { type: string }
        evidence: { type: string }
        candidateAnswer: { type: string }
        scenarioFamilyId: { type: ["string", "null"] }
        risk: { $ref: "#/components/schemas/Risk" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        version: { type: integer }
        mode: { type: string, enum: [demo, live] }
        finalLabel:
          type: ["string", "null"]
          enum: [supported, contradicted, insufficient_evidence, null]
        proposal:
          type: [object, "null"]
          allOf:
            - { $ref: "#/components/schemas/Proposal" }
        createdAt: { type: string, format: date-time }
    EvaluateInput:
      type: object
      required: [taskIds, mode, ownerConsent]
      properties:
        taskIds:
          type: array
          minItems: 1
          maxItems: 25
          items: { type: string }
        mode: { type: string, enum: [demo, live] }
        experimentRunId: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$', description: Stable run identity; changing it requests a separate evaluation without deleting history. }
        questionVersion: { type: string, enum: [evidence-v1] }
        contextPreparationVersion: { type: string, enum: [raw-evidence-v1] }
        requestedModel: { type: string, enum: [demo-simulator-v1, jev-1.13.0] }
        ownerConsent: { type: boolean }
        outboundReviewed: { type: boolean, description: Required for live mode; confirms review of actual outbound task text for private data }
    EvaluateResult:
      type: object
      required: [processed, failed, queued, mode]
      properties:
        processed: { type: integer }
        failed: { type: integer }
        queued: { type: integer }
        mode: { type: string, enum: [demo, live] }
    EvaluationRetryInput:
      type: object
      required: [taskId, mode, ownerConsent]
      properties:
        jobId: { type: string, description: Exact current job ID; superseded runs cannot be retried through this endpoint. }
        taskId: { type: string }
        mode: { type: string, enum: [demo, live] }
        ownerConsent: { type: boolean }
        outboundReviewed: { type: boolean, description: Required for live mode; confirms review of actual outbound task text for private data }
    EvaluationJob:
      type: object
      required: [id, taskId, mode, status, attempts, lastError, createdAt, updatedAt]
      properties:
        id: { type: string }
        evaluationId: { type: [string, "null"] }
        current: { type: boolean }
        evaluation:
          type: [object, "null"]
          allOf:
            - { $ref: "#/components/schemas/EvaluationProvenance" }
        taskId: { type: string }
        mode: { type: string, enum: [demo, live] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        attempts: { type: integer }
        lastError: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewItem:
      type: object
      required: [task, routingReasons]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        routingReasons:
          type: array
          items: { type: string }
    ReviewInput:
      type: object
      required: [taskId, version, action, activeMs]
      properties:
        taskId: { type: string }
        version: { type: integer }
        action: { type: string, enum: [accept, correct, escalate, label] }
        claimToken: { type: [string, "null"], description: Current fencing token when an active claim exists or claims are required }
        correctedLabel: { type: ["string", "null"], enum: [supported, contradicted, insufficient_evidence, null] }
        reason: { type: ["string", "null"], maxLength: 2000 }
        evidenceExcerpt: { type: ["string", "null"], maxLength: 2000 }
        activeMs: { type: integer, minimum: 0, maximum: 7200000 }
    FactoryPolicy:
      type: object
      additionalProperties: false
      required: [schemaVersion, assistanceAllowed, requireAssignments, highRiskLane, minimumConfidence, redirectionThreshold]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        assistanceAllowed: { type: boolean }
        requireAssignments: { type: boolean }
        highRiskLane: { type: string, enum: [human_review, escalation] }
        minimumConfidence: { type: number, minimum: 0, maximum: 1 }
        redirectionThreshold: { type: number, minimum: 0, maximum: 1 }
    FactoryPolicyInput:
      type: object
      required: [expectedRevision, definition]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        definition: { $ref: "#/components/schemas/FactoryPolicy" }
    FactoryClaimInput:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        expectedRevision: { type: integer, minimum: 0, description: Current control revision required for explicit owner reassignment }
        minutes: { type: integer, minimum: 1, maximum: 15, default: 10 }
        claimToken: { type: [string, "null"] }
        assignedTo: { type: string, description: Current member user ID; authenticated owner required to assign another member }
        reassign: { type: boolean, description: Explicit owner reassignment of another active assignee }
    FactoryQuarantineInput:
      type: object
      required: [expectedRevision, quarantined, reason]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        quarantined: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    FactoryQueue:
      type: object
      required: [factory, policy, items, counts, actor, canConfigure, releaseGate]
      properties:
        factory: { type: string, enum: [evidence, preference] }
        policy:
          type: object
          required: [revision, definition]
          properties:
            revision: { type: integer }
            definition: { $ref: "#/components/schemas/FactoryPolicy" }
        items:
          type: array
          items:
            type: object
            required: [id, workKind, title, version, lane, reasons, automaticAcceptance, quarantined, quarantineReason, controlRevision, assignedTo, expiresAt, claimToken]
            properties:
              id: { type: string }
              workKind: { type: string, enum: [task, comparison, audit] }
              title: { type: string }
              version: { type: integer }
              lane: { type: string, enum: [human_review, assistance, escalation, blind_audit, quarantine, complete] }
              reasons: { type: array, items: { type: string } }
              automaticAcceptance: { type: boolean, enum: [false] }
              quarantined: { type: boolean }
              quarantineReason: { type: [string, "null"] }
              controlRevision: { type: integer }
              assignedTo: { type: [string, "null"] }
              expiresAt: { type: [string, "null"], format: date-time }
              claimToken: { type: [string, "null"] }
        counts: { type: object, additionalProperties: { type: integer } }
        actor: { type: string }
        canConfigure: { type: boolean }
        releaseGate: { type: string }
    Metrics:
      type: object
      required: [total, pending, proposed, escalated, finalized, failures, corrections, correctionDenominator, shadowCoverage, averageReviewMs, averageLatencyMs, independentAccuracy]
      properties:
        total: { type: integer }
        pending: { type: integer }
        proposed: { type: integer }
        escalated: { type: integer }
        finalized: { type: integer }
        failures: { type: integer }
        corrections: { type: integer }
        correctionDenominator: { type: integer }
        shadowCoverage: { type: number }
        averageReviewMs: { type: ["number", "null"] }
        averageLatencyMs: { type: ["number", "null"] }
        independentAccuracy: { type: ["number", "null"] }
    ReleaseInput:
      type: object
      required: [name, includeSourceText]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        includeSourceText: { type: boolean }
        privacyReviewed: { type: boolean, description: Explicit confirmation of actual source-text privacy review; required when includeSourceText is true }
    Release:
      type: object
      required: [id, name, itemCount, mode, digest, createdAt, includeSourceText]
      properties:
        id: { type: string }
        name: { type: string }
        itemCount: { type: integer }
        mode: { type: string, enum: [demo, live] }
        digest: { type: string }
        includeSourceText: { type: boolean }
        createdAt: { type: string, format: date-time }
    Audit:
      type: object
      required: [id, status, sampleSize, seed, samplingFrameHash, independent, required, completedItems, effectiveSampleSize, openDisputes, createdAt]
      properties:
        id: { type: string }
        status: { type: string }
        sampleSize: { type: integer }
        seed: { type: string }
        samplingFrameHash: { type: string }
        independent: { type: boolean }
        required: { type: boolean }
        completedItems: { type: integer }
        effectiveSampleSize: { type: integer }
        openDisputes: { type: integer }
        createdAt: { type: string, format: date-time }
    AuditInput:
      type: object
      required: [sampleSize, independent, required]
      properties:
