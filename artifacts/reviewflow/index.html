<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>ReviewFlow</title>
    <meta name="description" content="Experimental human-in-the-loop review workflow for synthetic evidence-grounding tasks." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="ReviewFlow" />
    <meta property="og:description" content="Experimental human-in-the-loop review workflow for synthetic evidence-grounding tasks." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReviewFlow" />
    <meta name="twitter:description" content="Experimental human-in-the-loop review workflow for synthetic evidence-grounding tasks." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("rf.theme");
          var theme = stored;
          if (theme === "light" || theme === "dark" || theme === "plum") {
            document.documentElement.setAttribute("data-theme", theme);
          } else {
            var prefersDark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.setAttribute(
              "data-theme",
              prefersDark ? "dark" : "light",
            );
          }
        } catch (_) {
          /* ignore storage / media errors before paint */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
